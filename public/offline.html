<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">

    <meta name="theme-color" content="#1b2b2b">
    <title>Offline · TwisWua Arcade</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100dvh; display: grid; place-items: center; padding: 24px; background: #1b2b2b; color: #f5eed9; font: 16px system-ui, sans-serif; }
      main { max-width: 400px; text-align: center; }
      .tiger { font-size: 64px; }
      h1 { color: #ecc17e; }
      p { color: #bccabb; line-height: 1.6; }
      a { display: inline-block; margin-top: 12px; padding: 14px 22px; border: 1px solid #739178; border-radius: 6px; background: #34483f; color: #fff2d2; text-decoration: none; }
      a:focus-visible { outline: 3px solid #ecc17e; outline-offset: 4px; }
    </style>
  </head>
  <body>
    <main>
      <div class="tiger" aria-hidden="true">🐯</div>
      <h1>A little off the grid.</h1>
      <p>This page isn’t available offline yet. Return to the arcade to play downloaded games, or reconnect and try again.</p>
